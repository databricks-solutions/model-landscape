resources:
  jobs:
    refresh_control_plane:
      name: ${var.app_name}-refresh
      max_concurrent_runs: 1
      queue:
        enabled: true
      job_clusters:
        - job_cluster_key: refresh_compute
          new_cluster:
            spark_version: ${var.refresh_spark_version}
            data_security_mode: ${var.refresh_data_security_mode}
            node_type_id: ${var.refresh_node_type_id}
            num_workers: ${var.refresh_num_workers}
      parameters:
        - name: warehouse_id
          default: ${var.sql_warehouse_id}
        - name: control_plane_catalog
          default: ${var.control_plane_catalog}
        - name: control_plane_schema
          default: ${var.control_plane_schema}
        - name: scope
          default: scheduler
        - name: model_key
          default: ""
        - name: use_lakebase_read_model
          default: "true"
        - name: lakebase_instance_name
          default: ${var.lakebase_instance_name}
        - name: lakebase_database_name
          default: ${var.lakebase_database_name}
        - name: lakebase_host
          default: ""
        - name: lakebase_port
          default: "5432"
        - name: lakebase_pguser
          default: ${var.lakebase_pguser}
        - name: lakebase_sslmode
          default: "require"
        - name: lakebase_schema
          default: ${var.lakebase_schema}
      tasks:
        - task_key: refresh_control_plane
          python_wheel_task:
            package_name: model_landscape
            entry_point: model-landscape-refresh
            named_parameters:
              warehouse-id: "{{job.parameters.warehouse_id}}"
              catalog: "{{job.parameters.control_plane_catalog}}"
              schema: "{{job.parameters.control_plane_schema}}"
              scope: "{{job.parameters.scope}}"
              model-key: "{{job.parameters.model_key}}"
              use-lakebase-read-model: "{{job.parameters.use_lakebase_read_model}}"
              lakebase-instance-name: "{{job.parameters.lakebase_instance_name}}"
              lakebase-database-name: "{{job.parameters.lakebase_database_name}}"
              lakebase-host: "{{job.parameters.lakebase_host}}"
              lakebase-port: "{{job.parameters.lakebase_port}}"
              lakebase-pguser: "{{job.parameters.lakebase_pguser}}"
              lakebase-sslmode: "{{job.parameters.lakebase_sslmode}}"
              lakebase-schema: "{{job.parameters.lakebase_schema}}"
          job_cluster_key: refresh_compute
          libraries:
            - whl: ../dist/*.whl
            - pypi:
                package: dash>=2.18,<3.0
            - pypi:
                package: dash-bootstrap-components>=1.6,<2.0
            - pypi:
                package: databricks-sdk>=0.81,<1.0
            - pypi:
                package: databricks-sql-connector>=3.0,<4.0
            - pypi:
                package: mlflow-skinny>=2.20,<3.0
            - pypi:
                package: numpy>=1.26,<3.0
            - pypi:
                package: pandas>=2.2,<3.0
            - pypi:
                package: plotly>=5.24,<6.0
            - pypi:
                package: psycopg[binary]>=3.2,<4.0
            - pypi:
                package: scikit-learn>=1.5,<2.0
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: ${var.refresh_timeout_seconds}
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
