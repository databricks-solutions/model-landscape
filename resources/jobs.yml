resources:
  jobs:
    refresh_control_plane:
      name: ${var.app_name}-refresh
      tasks:
        - task_key: refresh_control_plane
          spark_python_task:
            python_file: ../scripts/model_lens_refresh.py
            parameters:
              - --warehouse-id
              - ${var.sql_warehouse_id}
          environment_key: refresh_runtime
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600
      environments:
        - environment_key: refresh_runtime
          spec:
            client: "2"
            dependencies:
              - dash>=2.18,<3.0
              - dash-bootstrap-components>=1.6,<2.0
              - databricks-sdk>=0.81,<1.0
              - databricks-sql-connector>=3.0,<4.0
              - numpy>=1.26,<3.0
              - pandas>=2.2,<3.0
              - plotly>=5.24,<6.0
              - scikit-learn>=1.5,<2.0
