resources:
  jobs:
    refresh_control_plane:
      name: ${var.app_name}-refresh
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: refresh_control_plane
          python_wheel_task:
            package_name: model_lens
            entry_point: model-lens-refresh
            parameters:
              - --warehouse-id
              - ${var.sql_warehouse_id}
              - --catalog
              - ${var.control_plane_catalog}
              - --schema
              - ${var.control_plane_schema}
              - --scope
              - scheduler
          environment_key: refresh_runtime
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      environments:
        - environment_key: refresh_runtime
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
              - dash>=2.18,<3.0
              - dash-bootstrap-components>=1.6,<2.0
              - databricks-sdk>=0.81,<1.0
              - databricks-sql-connector>=3.0,<4.0
              - numpy>=1.26,<3.0
              - pandas>=2.2,<3.0
              - plotly>=5.24,<6.0
              - psycopg[binary]>=3.2,<4.0
              - scikit-learn>=1.5,<2.0
