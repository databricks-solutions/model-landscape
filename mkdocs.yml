site_name: mlflow-lens
site_description: "MLflow enrichment SDK: Plotly-native panels, drift, and run summaries."
site_url: https://databricks-solutions.github.io/model-landscape/
repo_url: https://github.com/databricks-solutions/model-landscape
repo_name: databricks-solutions/model-landscape
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: model-lens-logo.png
  favicon: model-lens-logo.png
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [mlflow-lens/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

exclude_docs: |
  _build_gallery.py
  gallery/_template.md
  ARCHITECTURE.md
  DEPLOY_TO_WORKSPACE.md
  EXISTING_APP_DEPLOYMENT.md
  WORKSPACE_SMOKE_TEST.md
  MLFLOW_LENS_SDK.md

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Concepts: concepts.md
  - Gallery:
      - gallery/index.md
      - Classification:
          - ROC / AUC: gallery/roc_auc.md
          - Confusion Matrix: gallery/confusion_matrix.md
          - Precision-Recall: gallery/precision_recall.md
          - Classification Report: gallery/classification_report.md
          - Class Prediction Error: gallery/class_prediction_error.md
          - Discrimination Threshold: gallery/discrimination_threshold.md
      - Regression:
          - Prediction Error: gallery/prediction_error.md
          - Residuals: gallery/residuals.md
          - Alpha Selection: gallery/alpha_selection.md
      - Model Selection:
          - Learning Curve: gallery/learning_curve.md
          - Validation Curve: gallery/validation_curve.md
          - Feature Importances: gallery/feature_importances.md
          - CV Scores: gallery/cv_scores.md
  - API Reference:
      - api/index.md
      - Classifier panels: api/classifier.md
      - Regressor panels: api/regressor.md
      - Model selection panels: api/model_selection.md
      - Panels (low-level): api/panels.md
      - Drift: api/drift.md
      - Summary: api/summary.md
  - Changelog: changelog.md
