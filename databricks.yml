bundle:
  name: model-landscape

artifacts:
  default:
    type: whl
    build: |
      uv build --wheel --out-dir dist
      uv build --wheel --out-dir dist mlflow-lens
    path: .

include:
  - resources/*.yml

variables:
  app_name:
    default: model-landscape
  sql_warehouse_id:
    description: Existing SQL warehouse for the app and refresh workflow
  control_plane_catalog:
    description: Existing control-plane catalog for this workspace (for example hive_metastore)
  control_plane_schema:
    description: Existing control-plane schema for this workspace (for example model_landscape_control_plane)
  lakebase_instance_name:
    description: Existing Lakebase instance for fast Model Landscape UI reads
    default: ""
  lakebase_database_name:
    description: Existing Lakebase database name for Model Landscape projections
    default: ""
  lakebase_pguser:
    default: ""
  lakebase_schema:
    default: model_landscape_ui
  refresh_spark_version:
    default: "15.4.x-scala2.12"
  refresh_data_security_mode:
    description: Databricks access mode for the shared Spark refresh job cluster (USER_ISOLATION or SINGLE_USER for Unity Catalog access)
    default: USER_ISOLATION
  refresh_node_type_id:
    description: Existing Databricks node type for the shared Spark refresh job
  refresh_num_workers:
    default: 4
  refresh_timeout_seconds:
    default: 14400
  genie_space_id:
    default: ""

targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  warehouse_only:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
