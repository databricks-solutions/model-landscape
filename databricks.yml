bundle:
  name: model-lens

artifacts:
  default:
    type: whl
    build: python3 -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
    path: .

include:
  - resources/*.yml

variables:
  app_name:
    default: model-lens
  sql_warehouse_id:
    description: Existing SQL warehouse for the app and refresh workflow
  control_plane_catalog:
    default: model_observability
  control_plane_schema:
    default: control_plane
  lakebase_instance_name:
    description: Existing Lakebase instance for fast Model Lens UI reads
    default: ""
  lakebase_database_name:
    description: Existing Lakebase database name for Model Lens projections
    default: ""
  lakebase_pguser:
    default: ""
  lakebase_schema:
    default: model_lens_ui
  genie_space_id:
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  warehouse_only:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      apps:
        control_plane:
          resources:
            - name: sql_warehouse
              sql_warehouse:
                id: ${var.sql_warehouse_id}
                permission: CAN_USE
            - name: refresh_job
              job:
                id: ${resources.jobs.refresh_control_plane.id}
                permission: CAN_MANAGE_RUN
      jobs:
        refresh_control_plane:
          tasks:
            - task_key: refresh_control_plane
              python_wheel_task:
                package_name: model-lens
                entry_point: model-lens-refresh
                parameters:
                  - --warehouse-id
                  - ${var.sql_warehouse_id}
                  - --catalog
                  - ${var.control_plane_catalog}
                  - --schema
                  - ${var.control_plane_schema}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
