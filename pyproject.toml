[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-landscape"
version = "0.1.1"
description = "Model Landscape: Databricks-native model observability app"
requires-python = ">=3.10"
authors = [
  { name = "Scott McKean", email = "scott.mckean@databricks.com" },
  { name = "Volo Vragov" },
]
dependencies = [
  "dash>=3.0,<4.0",
  "dash-bootstrap-components>=2.0,<3.0",
  "databricks-sdk>=0.81,<1.0",
  "databricks-sql-connector>=3.0,<4.0",
  "mlflow-skinny>=2.20,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
  "mlflow-lens",
  "pyspark>=3.5,<4.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
model-landscape = "model_landscape.app:main"
model-landscape-refresh = "model_landscape.workflows.refresh_job:main"
model-landscape-setup = "model_landscape.workflows.setup_control_plane:main"
model-landscape-init-hooks = "model_landscape._dev:init_hooks"

[tool.ruff]
line-length = 100
target-version = "py310"
# Databricks notebooks rely on `%run` magic and implicit globals
# (`spark`, `dbutils`, `display`) that ruff can't resolve, so lint
# those trees as a whole.
extend-exclude = [
  ".venv",
  "dist",
  "site",
  "docs/gallery/_figures",
  "tutorial",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length handled by `ruff format` instead
  "B905",  # zip(..., strict=True) is nice-to-have, not a correctness issue
]

[tool.setuptools.packages.find]
include = ["model_landscape*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["mlflow-lens"]

[tool.uv.sources]
mlflow-lens = { workspace = true }
