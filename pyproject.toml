[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-landscape"
version = "0.2.0"
description = "Model Landscape: Databricks-native model observability app"
requires-python = ">=3.10"
authors = [
  { name = "Scott McKean", email = "scott.mckean@databricks.com" },
  { name = "Volo Vragov" },
]
dependencies = [
  "dash>=3.0,<4.0",
  "dash-bootstrap-components>=2.0,<3.0",
  "databricks-sdk>=0.81,<1.0",
  "databricks-sql-connector>=3.0,<4.0",
  "mlflow-skinny>=2.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "psycopg[binary]>=3.2,<4.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "mlflow-lens",
  "pyspark>=3.5,<4.0",
  "pytest>=8.3,<10.0",
]
docs = [
  "mlflow-lens",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-include-markdown-plugin>=6.0",
]

[project.scripts]
model-landscape = "model_landscape.app:main"
model-landscape-refresh = "model_landscape.workflows.refresh_job:main"
model-landscape-setup = "model_landscape.workflows.setup_control_plane:main"

[tool.setuptools.packages.find]
include = ["model_landscape*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["mlflow-lens"]

[tool.uv.sources]
mlflow-lens = { workspace = true }
